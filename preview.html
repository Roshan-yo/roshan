<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Valentine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1 id="message"></h1>
    <p>This page was made just for you 💗</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "Someone";
    document.getElementById("message").innerText = `Dear ${name},`;
  </script>
</body>
</html>
